# Sirve el build web de Expo; cualquier ruta desconocida vuelve a index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
